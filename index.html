function table(cont,cols,rows,o){

  t.querySelectorAll('th').forEach(th=>{const go=()=>{const k=th.dataset.k;if(ss.k===k)ss.dir*=-1;else{ss.k=k;ss.dir=-1;}table(cont,cols,rows,o);};
    th.onclick=go;th.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go();}};});

    b.onclick=()=>{const q=v=>{const s=v==null?'':String(v);return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;};
      const txt=[cols.map(c=>q(c.label)).join(',')].concat(rs.map(r=>cols.map(c=>q(c.raw?c.raw(r):r[c.k])).join(','))).join('\n');
      const fallback=()=>{let ta=cont.querySelector('textarea.csv');if(!ta){ta=document.createElement('textarea');ta.className='csv';cont.appendChild(ta);}ta.value=txt;ta.select();b.textContent='아래 텍스트를 복사하세요';};

/* ---------- stats ---------- */
function stats(a){const L=a.length-1,cur=a[L],prev=a[L-1];const p7=a.slice(Math.max(0,L-7),L).filter(isNum);
  const avg7=p7.length?p7.reduce((x,y)=>x+y,0)/p7.length:null;let mi=null,ma=null;
  a.forEach((v,i)=>{if(!isNum(v))return;if(mi===null||v<a[mi])mi=i;if(ma===null||v>a[ma])ma=i;});
  let dir=0,run=0;for(let i=L;i>0;i--){if(!isNum(a[i])||!isNum(a[i-1]))break;const d=Math.sign(a[i]-a[i-1]);if(run===0){if(d===0)break;dir=d;run=1;}else if(d===dir)run++;else break;}
  const first=a.findIndex(isNum);
  return {cur,prev,avg7,mi,ma,dir,run,first,pos:(isNum(cur)&&mi!==null&&a[ma]>a[mi])?(cur-a[mi])/(a[ma]-a[mi])*100:null};}
const runTxt=s=>s.run===0?'변화 없음':(s.run===1?(s.dir>0?'전일 대비 상승':'전일 대비 하락'):`${s.run}일 연속 ${s.dir>0?'상승':'하락'}`);

function digestHtml(txt){
  if(!txt)return '<p class="cap">이 날짜의 코멘트 파일이 없습니다 — digests/'+esc(D.meta.latest)+'.txt 를 만들면 여기에 실립니다.</p>';
  const inl=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
  let h='',pre=[],ul=[];const fp_=()=>{if(pre.length){h+='<div class="tw"><pre class="mono">'+pre.map(esc).join('\n')+'</pre></div>';pre=[];}},fu=()=>{if(ul.length){h+='<ul>'+ul.join('')+'</ul>';ul=[];}};
  txt.split('\n').forEach(l=>{const s=l.trim();
    if(/^`.*`$/.test(s)){fu();pre.push(s.slice(1,-1));return;}fp_();
    if(!s){fu();return;}
    if(/^\*\*[^*]+\*\*$/.test(s)){fu();h+='<h3>'+esc(s.slice(2,-2))+'</h3>';return;}
    if(s.startsWith('- ')){ul.push('<li>'+inl(s.slice(2))+'</li>');return;}
    fu();h+='<p>'+inl(s)+'</p>';});
  fp_();fu();return h;}

function isDark(){const a=document.documentElement.getAttribute('data-theme');if(a==='dark')return true;if(a==='light')return false;return matchMedia('(prefers-color-scheme: dark)').matches;}

const SHARE_URL='https://rsm0kk.github.io/toptoonchat/',SHARE_TITLE='탑툰챗 일일 트래커';
function toast(m){let t=document.getElementById('toast');if(!t){t=document.createElement('div');t.id='toast';t.setAttribute('role','status');document.body.appendChild(t);}t.textContent=m;t.hidden=false;clearTimeout(t._h);t._h=setTimeout(()=>{t.hidden=true;},2200);}
async function copyLink(){try{await navigator.clipboard.writeText(SHARE_URL);toast('링크 복사됨');}catch(e){const a=document.createElement('textarea');a.value=SHARE_URL;a.style.position='fixed';a.style.opacity='0';document.body.appendChild(a);a.select();let ok=false;try{ok=document.execCommand('copy');}catch(_){}a.remove();toast(ok?'링크 복사됨':'복사 실패 — '+SHARE_URL);}}
function closeShare(){const m=document.getElementById('sharemenu');if(m)m.remove();}
const sbtn=document.getElementById('sharebtn');
sbtn.onclick=async(ev)=>{ev.stopPropagation();
  if(navigator.share&&matchMedia('(pointer:coarse)').matches){try{await navigator.share({title:SHARE_TITLE,text:document.getElementById('hsub').textContent,url:SHARE_URL});}catch(e){}return;}
  if(document.getElementById('sharemenu')){closeShare();return;}
  const u=encodeURIComponent(SHARE_URL),tx=encodeURIComponent(SHARE_TITLE);
  const m=document.createElement('div');m.id='sharemenu';m.className='sharemenu';m.setAttribute('role','menu');
  m.innerHTML=`<button type="button" data-a="copy">🔗 링크 복사</button><a href="https://t.me/share/url?url=${u}&text=${tx}" target="_blank" rel="noopener">✈️ 텔레그램으로 공유</a>`+(navigator.share?'<button type="button" data-a="native">📤 기타 앱으로 공유</button>':'');
  document.body.appendChild(m);const r=sbtn.getBoundingClientRect();
  m.style.top=(r.bottom+6)+'px';m.style.left=Math.max(8,Math.min(r.left,innerWidth-m.offsetWidth-8))+'px';
  m.onclick=async(e)=>{const a=e.target.closest('[data-a]');if(a&&a.dataset.a==='copy')await copyLink();if(a&&a.dataset.a==='native'){try{await navigator.share({title:SHARE_TITLE,url:SHARE_URL});}catch(_){}}closeShare();};};
document.addEventListener('click',e=>{if(!e.target.closest('#sharemenu'))closeShare();});
