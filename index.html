*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);overflow-x:hidden;

.wrap{max-width:1180px;margin:0 auto}
header{background:var(--navy);color:#fff;padding:20px 16px 16px}
.hdrow{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-start;justify-content:space-between}
header h1{margin:0 0 4px;font-size:22px;letter-spacing:-.02em}
header .sub{margin:0;color:#c5d2e6;font-size:13px}
.themebtn{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:8px;padding:8px 12px;font-size:13px;cursor:pointer;min-height:44px}
.sticky{position:sticky;top:0;z-index:30;background:var(--panel);border-bottom:1px solid var(--line)}

nav button{background:none;border:none;border-bottom:3px solid transparent;color:var(--ink-2);padding:12px 12px;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap;min-height:46px}

.toolbar{border-top:1px solid var(--line-soft);background:var(--panel-2)}
.toolbar .wrap{display:flex;flex-wrap:wrap;gap:8px 16px;padding:8px 12px;align-items:center}
.seg{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.seg .sl{font-size:12px;color:var(--ink-3);margin-right:4px;font-weight:600}
.seg button,.chip{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 11px;font-size:13px;color:var(--ink-2);cursor:pointer;min-height:44px}
.seg button[aria-pressed="true"],.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}

main{max-width:1180px;margin:0 auto;padding:16px 12px 70px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:16px;margin:0 0 16px;min-width:0}
.card h2{margin:0 0 4px;font-size:18px;letter-spacing:-.01em}
.card h3{margin:16px 0 6px;font-size:15px}
.cap{color:var(--ink-3);font-size:12.5px;margin:2px 0 12px}
p{margin:0 0 10px}

.pos{color:var(--up);font-weight:600}.neg{color:var(--down);font-weight:600}

.badge.warn{background:var(--warn-bg);color:var(--up)}

  function at(ev){const pt=ev.touches?ev.touches[0]:ev;if(!pt)return;const rc=svg.getBoundingClientRect(),sx=(pt.clientX-rc.left)*(W/rc.width);
    let i=stack?Math.floor((sx-L)/(pw/n)):Math.round((sx-L)/(pw/Math.max(1,n-1)));i=Math.max(0,Math.min(n-1,i));
    guide.setAttribute('x1',X(i));guide.setAttribute('x2',X(i));guide.setAttribute('visibility','visible');
    vis.forEach((s,k)=>{const v=s.values[i];if(!stack&&isNum(v)){marks[k].setAttribute('cx',X(i));marks[k].setAttribute('cy',Y(v));marks[k].setAttribute('visibility','visible');}else marks[k].setAttribute('visibility','hidden');});

function table(cont,cols,rows,o){

function stats(a){const L=a.length-1,cur=a[L],prev=a[L-1];const p7=a.slice(Math.max(0,L-7),L).filter(isNum);
  const avg7=p7.length?p7.reduce((x,y)=>x+y,0)/p7.length:null;let mi=null,ma=null;
  a.forEach((v,i)=>{if(!isNum(v))return;if(mi===null||v<a[mi])mi=i;if(ma===null||v>a[ma])ma=i;});
  let dir=0,run=0;for(let i=L;i>0;i--){if(!isNum(a[i])||!isNum(a[i-1]))break;const d=Math.sign(a[i]-a[i-1]);if(run===0){if(d===0)break;dir=d;run=1;}else if(d===dir)run++;else break;}
  const first=a.findIndex(isNum);
  return {cur,prev,avg7,mi,ma,dir,run,first,pos:(isNum(cur)&&mi!==null&&a[ma]>a[mi])?(cur-a[mi])/(a[ma]-a[mi])*100:null};}
const runTxt=s=>s.run===0?'변화 없음':(s.run===1?(s.dir>0?'전일 대비 상승':'전일 대비 하락'):`${s.run}일 연속 ${s.dir>0?'상승':'하락'}`);

function digestHtml(txt){

  let h='',pre=[],ul=[];const fp_=()=>{if(pre.length){h+='<div class="tw"><pre class="mono">'+pre.map(esc).join('\n')+'</pre></div>';pre=[];}},fu=()=>{if(ul.length){h+='<ul>'+ul.join('')+'</ul>';ul=[];}};
  txt.split('\n').forEach(l=>{const s=l.trim();
    if(/^`.*`$/.test(s)){fu();pre.push(s.slice(1,-1));return;}fp_();
    if(!s){fu();return;}

  <div class="card"><h2>주간 활동지수 (Top50 점수 합)</h2><p class="cap">랭킹 API의 score 합계 · 산식 비공개 · 기간 플로우라 누적보다 빨리 반응 · 이 탭은 상단 제외 기준·기간 토글과 무관</p><div id="m_wk"></div></div>
  <div class="card"><h2>주차별 상세</h2><div id="t_wk"></div></div>`;
  multiples(document.getElementById('m_wk'),'wk',r=>{const w=D.weekly[r]||[];if(!w.length)return null;
    return {labels:w.map(x=>'W'+x.p.slice(5)),tipLabels:w.map(x=>x.p+' 주차'),series:[{name:'활동지수 합',color:RC[r],values:w.map(x=>x.score)}],
      extra:i=>`<div class="row"><span class="lbl">전주비</span><span class="val">${col(isNum(w[i].chg)?w[i].chg*100:null,sp)}</span></div><div class="row"><span class="lbl">1위</span><span class="val">${esc(w[i].top1||'—')}</span></div>${w[i].capped?'':'<div class="row"><span class="lbl">주의</span><span class="val">50위 미충족</span></div>'}`,
      src:'출처: 탑툰챗 /api/ranking/weekly'};});
  const rows=[];REG.forEach(r=>(D.weekly[r]||[]).forEach(x=>rows.push({r:RL[r],p:x.p,score:x.score,chg:isNum(x.chg)?x.chg*100:null,top1:x.top1,capped:x.capped?'충족':'미충족'})));
  table(document.getElementById('t_wk'),[{k:'r',label:'지역'},{k:'p',label:'주차'},{k:'score',label:'활동지수 합',num:1,fmt:f0},{k:'chg',label:'전주비',num:1,html:r=>col(r.chg,sp)},{k:'top1',label:'1위 캐릭터'},{k:'capped',label:'50위 충족'}],rows,{id:'wk',sortK:'p',csv:1});
}
function renderCoh(){
  sec('coh').innerHTML=`
  <div class="card"><h2>코호트별 세션 증가 (24h 환산)</h2><p class="cap">신규 0~7일 / 성장 8~30일 / 잔존 31일+ · 코호트는 파이프라인 관측일 기준(출시일이 아닐 수 있음) · 막대에 올리면 합계까지 표시</p><div id="m_coh"></div></div>
  <div class="card"><h2>최신일 코호트 비중</h2><div id="t_coh"></div></div>`;
  const C={new:['신규(0-7일)','var(--c-new)'],ramp:['성장(8-30일)','var(--c-ramp)'],mature:['잔존(31일+)','var(--c-mat)']};
  multiples(document.getElementById('m_coh'),'coh',r=>({type:'stack',labels:labs(),tipLabels:tlabs(),unit:'건',
    series:Object.keys(C).map(k=>({name:C[k][0],color:C[k][1],values:V(D.cohort[st.basis][r][k])}))}));
  const rows=REG.map(r=>{const c=D.cohort[st.basis][r],v=k=>c[k][N],t=['new','ramp','mature'].reduce((a,k)=>a+(isNum(v(k))?v(k):0),0);
    return {r:RL[r],n:v('new'),ra:v('ramp'),m:v('mature'),t:t,nS:t?(v('new')||0)/t*100:null};});
  table(document.getElementById('t_coh'),[{k:'r',label:'지역'},{k:'n',label:'신규',num:1,fmt:f0},{k:'ra',label:'성장',num:1,fmt:f0},{k:'m',label:'잔존',num:1,fmt:f0},{k:'t',label:'합계',num:1,fmt:f0},{k:'nS',label:'신규 비중',num:1,fmt:v=>fp(v,1)}],rows,{id:'coh'});
}
function renderChars(){
  sec('chars').innerHTML=`
  <div class="card"><h2>캐릭터 상세 (${esc(D.meta.latest)})</h2><p class="cap">평소대비 = 오늘 세션 증가 ÷ 출시 후 일평균 (1.00배 = 평소) · 당일 전환율은 원값 기준 · 이상 ID는 제외 표시</p>
    <div class="row2"><div class="seg" id="chipR"></div><input class="search" id="q" type="search" placeholder="캐릭터 이름·ID 검색" aria-label="캐릭터 검색" value="${esc(st.q)}">
    <label class="cap" style="margin:0;display:flex;gap:6px;align-items:center;min-height:44px"><input type="checkbox" id="showEx" ${st.showEx?'checked':''}> 이상 ID 포함</label></div>
    <div id="t_chars"></div></div>`;
  const chip=document.getElementById('chipR');
  chip.innerHTML=['ALL'].concat(REG).map(r=>`<button type="button" class="chip" data-r="${r}" aria-pressed="${st.chipR===r}">${r==='ALL'?'전체':RL[r]}</button>`).join('');
  chip.querySelectorAll('button').forEach(b=>b.onclick=()=>{st.chipR=b.dataset.r;renderChars();});
  const draw=()=>{const q=st.q.trim().toLowerCase();
    const rows=D.chars.filter(c=>(st.chipR==='ALL'||c.r===st.chipR)&&(st.showEx||!c.ex)&&(!q||String(c.name).toLowerCase().includes(q)||String(c.id)===q))
      .map(c=>Object.assign({},c,{rl:RL[c.r],coh:{new_0_7:'신규',ramp_8_30:'성장',mature_31_plus:'잔존'}[c.cohort]||c.cohort,flag:c.ex?'제외':(D.watch.some(w=>w.id===c.id&&w.r===c.r)?'관찰':'')}));
    table(document.getElementById('t_chars'),[
      {k:'rl',label:'지역'},{k:'id',label:'ID',num:1},{k:'name',label:'캐릭터'},{k:'coh',label:'코호트'},{k:'dsl',label:'출시 후 일수',num:1,fmt:f0},
      {k:'cumS',label:'누적 세션',num:1,fmt:f0},{k:'dS',label:'세션 24h',num:1,fmt:f0},{k:'cva',label:'평소대비',num:1,fmt:v=>isNum(v)?v.toFixed(2)+'배':'—'},
      {k:'cumV',label:'누적 조회',num:1,fmt:f0},{k:'dV',label:'조회 증가(원값)',num:1,fmt:f0},{k:'conv',label:'당일 전환율',num:1,fmt:v=>fp(v)},{k:'convCum',label:'누적 전환율',num:1,fmt:v=>fp(v)},
      {k:'flag',label:'상태',html:r=>r.flag==='제외'?'<span class="badge warn">제외</span>':(r.flag?'<span class="badge">관찰</span>':'')}],rows,{id:'chars',sortK:'dS',csv:1});};
  const qi=document.getElementById('q');qi.oninput=()=>{st.q=qi.value;draw();};
  document.getElementById('showEx').onchange=e=>{st.showEx=e.target.checked;draw();};
  draw();
}
function renderEx(){
  sec('ex').innerHTML=`
  <div class="card"><h2>제외 기준이 전환율을 얼마나 바꾸나</h2><p class="cap">같은 날짜를 세 기준으로 계산 · 전일 대비 비교는 반드시 같은 기준으로 양일을 재계산해야 착시가 없음</p><div id="t_imp"></div></div>
  <div class="card"><h2>제외 중인 조회 카운터 이상 ID</h2>
    <div class="note">제외는 <b>ID 단위로 전 지역에 적용</b>함. 그래서 KR 100 장선영·KR 221 정은애처럼 해당 지역에서는 정상인 캐릭터도 함께 빠짐 — 세션 플로우가 그만큼 보수적으로 잡힘.</div>
    <p class="cap">현재 목록 ${D.meta.exMain.length}개: ${D.meta.exMain.join(', ')}</p><div id="t_exid"></div></div>
  <div class="card"><h2>신규 이상 후보 자동 점검</h2><p class="cap">최근 3일 · 제외 목록 밖 · 조회증가 3,000 이상 · 당일 전환율 1% 미만</p><div id="t_anom"></div>
    <h3>관찰 후보 (미추가)</h3><div id="t_watch"></div></div>`;

  table(document.getElementById('t_imp'),[{k:'r',label:'지역'}].concat(...KB.map(b=>[{k:b,label:BLS[b]+' · 오늘',num:1,fmt:v=>fp(v)},{k:b+'p',label:'전일',num:1,fmt:v=>fp(v)}])),rows,{id:'imp'});
  table(document.getElementById('t_exid'),[{k:'r',label:'지역',fmt:v=>RL[v]},{k:'id',label:'ID',num:1},{k:'name',label:'캐릭터'},{k:'added',label:'추가일'},
    {k:'dV',label:'오늘 조회증가',num:1,fmt:f0},{k:'dS',label:'오늘 세션',num:1,fmt:f0},{k:'conv',label:'오늘 전환율',num:1,fmt:v=>fp(v)},
    {k:'dV7',label:'7일 조회증가',num:1,fmt:f0},{k:'dS7',label:'7일 세션',num:1,fmt:f0},{k:'conv7',label:'7일 전환율',num:1,fmt:v=>fp(v)}],D.exTable,{id:'exid',sortK:'dV7',csv:1});
  table(document.getElementById('t_anom'),[{k:'d',label:'날짜',fmt:sd},{k:'r',label:'지역',fmt:v=>RL[v]},{k:'id',label:'ID',num:1},{k:'name',label:'캐릭터'},
    {k:'dV',label:'조회증가',num:1,fmt:f0},{k:'dS',label:'세션',num:1,fmt:f0},{k:'conv',label:'전환율',num:1,fmt:v=>fp(v)}],D.anom,{id:'anom',sortK:'conv',sortDir:1,csv:1});
  table(document.getElementById('t_watch'),[{k:'r',label:'지역',fmt:v=>RL[v]},{k:'id',label:'ID',num:1},{k:'name',label:'캐릭터'},{k:'note',label:'관찰 사유'}],D.watch,{id:'watch'});
}
function renderDef(){
  sec('def').innerHTML=`<div class="card"><h2>정의와 한계</h2><ul>
  <li><b>세션</b> = API chatCount. 대화 턴 수가 아니라 시작된 세션 수 (시나리오별 sessionCount 합과 일치 확인)</li>
  <li><b>조회</b> = viewCount. 페이지 진입마다 +1, 인증 없이 올라가는 카운터 → 절대값 신뢰 낮음, 추세만</li>
  <li><b>조회→세션 전환율</b> = 세션 ÷ 조회 × 100. 유료 결제 전환율이 아님 — 결제 전환은 공개 API에 없어 관측 불가</li>
  <li><b>24h 환산</b> = 증가분 × 24 ÷ 실제 수집 간격(시간). 수집 시각이 매일 달라 창이 18~32시간으로 흔들림</li>
  <li><b>수집 누락일</b> — 직전 수집이 36시간 넘게 떨어진 날(${esc((D.meta.filled||[]).join(', ')||'없음')})은 그 기간 누적 차분을 24h로 나눈 평균값. 하루치와 직접 비교는 참고용</li>
  <li><b>이상 ID 제외</b> = 조회만 비정상적으로 늘고 세션은 거의 없는 ID. 지역이 아니라 ID를 따라다니므로 ID 단위로 전 지역에서 뺌</li>
  <li><b>CN(간체)</b> = 대만 인스턴스와 같은 데이터 → 전 지표에서 제외. <b>GLOBAL</b> = 북미·글로벌 인스턴스</li>
  <li><b>코호트</b> = 파이프라인 최초 관측일 기준. 실제 출시일과 다를 수 있음</li>
  <li><b>활동지수</b> = 랭킹 API score의 Top50 합. 산식 비공개. 50위를 못 채운 초기 주차는 과소평가</li>
  <li>값이 없으면 0으로 채우지 않고 "데이터 없음"으로 둠</li></ul>
  <p class="cap">DB 갱신 ${esc(D.meta.db_mtime)} · 페이지 생성 ${esc(D.meta.generated)} · 품질 이슈 ${D.meta.dq_issues==null?'미확인':D.meta.dq_issues+'건'}</p></div>`;
}
const R={sum:renderSum,conv:renderConv,flow:renderFlow,week:renderWeek,coh:renderCoh,chars:renderChars,ex:renderEx,def:renderDef};

function renderControls(){
  const sb=document.getElementById('segBasis'),sr=document.getElementById('segRange');
  sb.innerHTML='<span class="sl">제외 기준</span>'+Object.keys(BLS).map(k=>`<button type="button" data-b="${k}" aria-pressed="${st.basis===k}">${BLS[k]}</button>`).join('');
  sr.innerHTML='<span class="sl">기간</span>'+Object.keys(RANGES).map(k=>`<button type="button" data-r="${k}" aria-pressed="${st.range===k}">${RANGES[k]}</button>`).join('');
  sb.querySelectorAll('button').forEach(b=>b.onclick=()=>{st.basis=b.dataset.b;save();renderControls();renderTab();});
  sr.querySelectorAll('button').forEach(b=>b.onclick=()=>{st.range=b.dataset.r;save();renderControls();renderTab();});
  document.getElementById('hsub').textContent=`스냅샷 ${String(D.meta.snapshot).replace('T',' ').slice(0,16)} KST · ${BL[st.basis]} · CN 제외 · 생성 ${D.meta.generated}`;
}
function renderTab(){hideTip();hideAll.length=0;
  document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.t===st.tab?'true':'false'));
  Object.keys(R).forEach(t=>{sec(t).hidden=t!==st.tab;});R[st.tab]();}
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{st.tab=b.dataset.t;save();renderTab();});

function isDark(){const a=document.documentElement.getAttribute('data-theme');if(a==='dark')return true;if(a==='light')return false;return matchMedia('(prefers-color-scheme: dark)').matches;}
const tb=document.getElementById('themebtn');
function syncTheme(){tb.textContent=isDark()?'라이트 모드':'다크 모드';}
tb.onclick=()=>{document.documentElement.setAttribute('data-theme',isDark()?'light':'dark');syncTheme();};
new MutationObserver(syncTheme).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',syncTheme);}catch(e){}
let rw=0,rt=null;addEventListener('resize',()=>{if(innerWidth===rw)return;clearTimeout(rt);rt=setTimeout(()=>{rw=innerWidth;if(st.tab!=='chars')renderTab();},150);});
rw=innerWidth;syncTheme();renderControls();renderTab();
window.__ttc={st:st,D:D,render:renderTab};
})();
</script>
