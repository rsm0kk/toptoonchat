*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);overflow-x:hidden;

.wrap{max-width:1180px;margin:0 auto}
header{background:var(--navy);color:#fff;padding:20px 16px 16px}
.hdrow{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-start;justify-content:space-between}
header h1{margin:0 0 4px;font-size:22px;letter-spacing:-.02em}
header .sub{margin:0;color:#c5d2e6;font-size:13px}
.themebtn{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:8px;padding:8px 12px;font-size:13px;cursor:pointer;min-height:44px}
.sticky{position:sticky;top:0;z-index:30;background:var(--panel);border-bottom:1px solid var(--line)}

.toolbar .wrap{display:flex;flex-wrap:wrap;gap:8px 16px;padding:8px 12px;align-items:center}
.seg{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.seg .sl{font-size:12px;color:var(--ink-3);margin-right:4px;font-weight:600}
.seg button,.chip{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 11px;font-size:13px;color:var(--ink-2);cursor:pointer;min-height:44px}
.seg button[aria-pressed="true"],.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}

main{max-width:1180px;margin:0 auto;padding:16px 12px 70px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:16px;margin:0 0 16px;min-width:0}
.card h2{margin:0 0 4px;font-size:18px;letter-spacing:-.01em}
.card h3{margin:16px 0 6px;font-size:15px}
.cap{color:var(--ink-3);font-size:12.5px;margin:2px 0 12px}
p{margin:0 0 10px}

.pos{color:var(--up);font-weight:600}.neg{color:var(--down);font-weight:600}

.badge.warn{background:var(--warn-bg);color:var(--up)}

  const Y=v=>T+ph-(v-lo)/(hi-lo)*ph;

  if(stack){

      el('rect',{x:(X(i)-bw/2).toFixed(1),y:Math.min(Y(a),Y(b)).toFixed(1),width:bw.toFixed(1),height:Math.max(.5,Math.abs(Y(a)-Y(b))).toFixed(1),style:'fill:'+s.color},svg);});}
    if(lo<0)el('line',{x1:L,x2:W-R,y1:Y(0),y2:Y(0),style:'stroke:var(--ink-3)'},svg);
  }else{
    vis.forEach(s=>{let d='',pen=false;s.values.forEach((v,i)=>{if(isNum(v)){d+=(pen?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1);pen=true;}else pen=false;});
      if(d)el('path',{d:d,style:`fill:none;stroke:${s.color};stroke-width:2.2;stroke-linejoin:round`},svg);
      s.values.forEach((v,i)=>{if(isNum(v))el('circle',{cx:X(i).toFixed(1),cy:Y(v).toFixed(1),r:2.6,style:'fill:'+s.color},svg);});});
  }
  const guide=el('line',{x1:0,x2:0,y1:T,y2:T+ph,style:'stroke:var(--ink-3);stroke-dasharray:3 3',visibility:'hidden'},svg);
  const marks=vis.map(s=>el('circle',{cx:0,cy:0,r:5,style:`fill:var(--panel);stroke:${s.color};stroke-width:2.5`,visibility:'hidden'},svg));
  const hit=el('rect',{x:L,y:T,width:pw,height:ph,style:'fill:transparent;cursor:crosshair'},svg);
  function at(ev){const pt=ev.touches?ev.touches[0]:ev;if(!pt)return;const rc=svg.getBoundingClientRect(),sx=(pt.clientX-rc.left)*(W/rc.width);
    let i=stack?Math.floor((sx-L)/(pw/n)):Math.round((sx-L)/(pw/Math.max(1,n-1)));i=Math.max(0,Math.min(n-1,i));
    guide.setAttribute('x1',X(i));guide.setAttribute('x2',X(i));guide.setAttribute('visibility','visible');
    vis.forEach((s,k)=>{const v=s.values[i];if(!stack&&isNum(v)){marks[k].setAttribute('cx',X(i));marks[k].setAttribute('cy',Y(v));marks[k].setAttribute('visibility','visible');}else marks[k].setAttribute('visibility','hidden');});
    let h=`<div class="tt">${esc((o.tipLabels||o.labels)[i])}</div>`,tot=0,any=false;
    vis.forEach(s=>{const v=s.values[i];if(isNum(v)){tot+=v;any=true;}
      h+=`<div class="row"><span class="lbl"><i class="dot" style="background:${s.color}"></i>${esc(s.name)}</span><span class="val">${isNum(v)?(s.fmt||yf)(v)+(o.unit||''):'데이터 없음'}</span></div>`;});
    if(stack&&any&&vis.length>1)h+=`<div class="row tot"><span class="lbl">합계</span><span class="val">${yf(tot)}${o.unit||''}</span></div>`;
    if(o.extra)h+=o.extra(i)||'';
    h+=`<div class="src">${esc(o.src||SRC)}</div>`;showTip(h,pt.clientX,pt.clientY);}
  function leave(){guide.setAttribute('visibility','hidden');marks.forEach(m=>m.setAttribute('visibility','hidden'));hideTip();}
  hideAll.push(()=>{guide.setAttribute('visibility','hidden');marks.forEach(m=>m.setAttribute('visibility','hidden'));});
  hit.addEventListener('mousemove',at);hit.addEventListener('mouseleave',leave);
  hit.addEventListener('touchstart',at,{passive:true});hit.addEventListener('touchmove',at,{passive:true});
  if(o.series.length>1){const lg=document.createElement('div');lg.className='legend';
    o.series.forEach(s=>{const b=document.createElement('button');b.type='button';b.dataset.off=off[s.name]?'1':'0';b.setAttribute('aria-pressed',off[s.name]?'false':'true');

}

function table(cont,cols,rows,o){
  o=o||{};cont.innerHTML='';const ss=st.sort[o.id]||(st.sort[o.id]={k:o.sortK||null,dir:o.sortDir||-1});
  const rs=rows.slice();
  if(ss.k)rs.sort((a,b)=>{const x=a[ss.k],y=b[ss.k];if(x==null&&y==null)return 0;if(x==null)return 1;if(y==null)return -1;
    return (typeof x==='number'&&typeof y==='number'?x-y:String(x).localeCompare(String(y),'ko'))*ss.dir;});
  const w=document.createElement('div');w.className='tw';const t=document.createElement('table');
  t.innerHTML='<thead><tr>'+cols.map(c=>`<th class="${c.num?'num':''}" data-k="${c.k}" tabindex="0" aria-sort="${ss.k===c.k?(ss.dir>0?'ascending':'descending'):'none'}">${esc(c.label)}${ss.k===c.k?(ss.dir>0?' ▲':' ▼'):''}</th>`).join('')+'</tr></thead>'
    +'<tbody>'+(rs.length?rs.map(r=>'<tr>'+cols.map(c=>`<td class="${c.num?'num':''}">${c.html?c.html(r):esc(c.fmt?c.fmt(r[c.k],r):r[c.k])}</td>`).join('')+'</tr>').join(''):`<tr><td colspan="${cols.length}">해당 행 없음</td></tr>`)+'</tbody>';
  t.querySelectorAll('th').forEach(th=>{const go=()=>{const k=th.dataset.k;if(ss.k===k)ss.dir*=-1;else{ss.k=k;ss.dir=-1;}table(cont,cols,rows,o);};
    th.onclick=go;th.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go();}};});
  w.appendChild(t);cont.appendChild(w);
  if(o.csv){const b=document.createElement('button');b.type='button';b.className='mini-btn';b.textContent=`CSV 복사 (${rs.length}행)`;
    b.onclick=()=>{const q=v=>{const s=v==null?'':String(v);return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;};
      const txt=[cols.map(c=>q(c.label)).join(',')].concat(rs.map(r=>cols.map(c=>q(c.raw?c.raw(r):r[c.k])).join(','))).join('\n');
      const fallback=()=>{let ta=cont.querySelector('textarea.csv');if(!ta){ta=document.createElement('textarea');ta.className='csv';cont.appendChild(ta);}ta.value=txt;ta.select();b.textContent='아래 텍스트를 복사하세요';};
      try{navigator.clipboard.writeText(txt).then(()=>{b.textContent='복사됨 ✓';},fallback);}catch(e){fallback();}};
    cont.appendChild(b);}
}

/* ---------- stats ---------- */
function stats(a){const L=a.length-1,cur=a[L],prev=a[L-1];const p7=a.slice(Math.max(0,L-7),L).filter(isNum);
  const avg7=p7.length?p7.reduce((x,y)=>x+y,0)/p7.length:null;let mi=null,ma=null;
  a.forEach((v,i)=>{if(!isNum(v))return;if(mi===null||v<a[mi])mi=i;if(ma===null||v>a[ma])ma=i;});
  let dir=0,run=0;for(let i=L;i>0;i--){if(!isNum(a[i])||!isNum(a[i-1]))break;const d=Math.sign(a[i]-a[i-1]);if(run===0){if(d===0)break;dir=d;run=1;}else if(d===dir)run++;else break;}
  const first=a.findIndex(isNum);
  return {cur,prev,avg7,mi,ma,dir,run,first,pos:(isNum(cur)&&mi!==null&&a[ma]>a[mi])?(cur-a[mi])/(a[ma]-a[mi])*100:null};}
const runTxt=s=>s.run===0?'변화 없음':(s.run===1?(s.dir>0?'전일 대비 상승':'전일 대비 하락'):`${s.run}일 연속 ${s.dir>0?'상승':'하락'}`);

const sec=t=>document.getElementById('s-'+t);
function digestHtml(txt){
  if(!txt)return '<p class="cap">이 날짜의 코멘트 파일이 없습니다 — digests/'+esc(D.meta.latest)+'.txt 를 만들면 여기에 실립니다.</p>';
  const inl=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
  let h='',pre=[],ul=[];const fp_=()=>{if(pre.length){h+='<div class="tw"><pre class="mono">'+pre.map(esc).join('\n')+'</pre></div>';pre=[];}},fu=()=>{if(ul.length){h+='<ul>'+ul.join('')+'</ul>';ul=[];}};
  txt.split('\n').forEach(l=>{const s=l.trim();
    if(/^`.*`$/.test(s)){fu();pre.push(s.slice(1,-1));return;}fp_();
    if(!s){fu();return;}
    if(/^\*\*[^*]+\*\*$/.test(s)){fu();h+='<h3>'+esc(s.slice(2,-2))+'</h3>';return;}
    if(s.startsWith('- ')){ul.push('<li>'+inl(s.slice(2))+'</li>');return;}
    fu();h+='<p>'+inl(s)+'</p>';});
  fp_();fu();return h;}

function renderDef(){
  sec('def').innerHTML=`<div class="card"><h2>정의와 한계</h2><ul>

  <li><b>조회→세션 전환율</b> = 세션 ÷ 조회 × 100. 유료 결제 전환율이 아님 — 결제 전환은 공개 API에 없어 관측 불가</li>

  <li><b>이상 ID 제외</b> = 조회만 비정상적으로 늘고 세션은 거의 없는 ID. 지역이 아니라 ID를 따라다니므로 ID 단위로 전 지역에서 뺌</li>
  <li><b>CN(간체)</b> = 대만 인스턴스와 같은 데이터 → 전 지표에서 제외. <b>GLOBAL</b> = 북미·글로벌 인스턴스</li>
  <li><b>코호트</b> = 파이프라인 최초 관측일 기준. 실제 출시일과 다를 수 있음</li>

function isDark(){const a=document.documentElement.getAttribute('data-theme');if(a==='dark')return true;if(a==='light')return false;return matchMedia('(prefers-color-scheme: dark)').matches;}
const tb=document.getElementById('themebtn');
function syncTheme(){tb.textContent=isDark()?'라이트 모드':'다크 모드';}
tb.onclick=()=>{document.documentElement.setAttribute('data-theme',isDark()?'light':'dark');syncTheme();};
new MutationObserver(syncTheme).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',syncTheme);}catch(e){}
let rw=0,rt=null;addEventListener('resize',()=>{if(innerWidth===rw)return;clearTimeout(rt);rt=setTimeout(()=>{rw=innerWidth;if(st.tab!=='chars')renderTab();},150);});
rw=innerWidth;syncTheme();renderControls();renderTab();
window.__ttc={st:st,D:D,render:renderTab};
